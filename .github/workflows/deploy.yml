name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base:
        # Diff override for replaying a failed deploy: the push path
        # diffs event.before -> HEAD, so files from a run that failed
        # mid-upload are never retried. Pass the last successfully
        # deployed commit here to re-upload everything since.
        description: 'Base commit to diff against (empty = event.before / HEAD^)'
        required: false
        type: string
      delete:
        # Escape hatch for remote cleanup — e.g. a file uploaded before
        # it was added to the exclusion list. Excluded files can never
        # reach the delete list via git diff, so this is the only way
        # to remove them short of FTPing in by hand.
        description: 'Extra remote paths to delete (comma-separated, repo-relative)'
        required: false
        type: string

# One deploy at a time — a new push cancels the running one instead of
# competing for InfinityFree's limited concurrent FTP connections.
concurrency:
  group: deploy-infinityfree
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so `git diff` can compare against the commit
          # that was live before this push.
          fetch-depth: 0

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp >/dev/null

      # Stage ONLY the files this push changed into .deploy/, so FTP
      # transfers a handful of files instead of scanning ~11k tracked
      # files on every commit.
      - name: Prepare changed files
        shell: bash
        env:
          DELETE_PATHS: ${{ inputs.delete }}
        run: |
          set -euo pipefail

          mkdir -p .deploy

          # Manual runs can pin the diff base (replays missed uploads).
          # On push, GitHub tells us the commit that was live before;
          # fall back to the previous commit for a bare manual run.
          if [[ -n "${{ inputs.base }}" ]]; then
            BASE="${{ inputs.base }}"
          elif [[ "${{ github.event_name }}" == "push" ]] &&
             [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD^)"
          fi

          echo "Deploying changes: $BASE -> $GITHUB_SHA"

          export BASE

          python3 <<'PY'
          import os
          import subprocess
          import shutil
          import fnmatch
          from pathlib import Path

          base = os.environ["BASE"]

          # Same scope as the old FTP-Deploy-Action exclude list:
          # excluded paths are never uploaded AND never deleted remotely.
          excluded_prefixes = (
              ".git/",
              ".github/",
              "node_modules/",
              "wp-content/uploads/",
              "wp-content/cache/",
              "wp-content/upgrade/",
              "wp-content/w3tc-config/",
              "wp-content/plugins/w3-total-cache/",
              ".docker-local/",
              ".claude/",
              ".ftp-live/",
              ".playwright-mcp/",
              ".playwright-cli/",
          )

          excluded_exact = {
              ".env",
              ".gitignore",
              ".gitattributes",
              ".editorconfig",
              "wp-config.php",
              "wp-content/debug.log",
              "wp-content/advanced-cache.php",
              "README.md",
              "CHANGELOG.md",
              "CODE_OF_CONDUCT.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "LICENSE",
              # Local-only dev artifacts — never belong on the webroot.
              # LOCAL-DB-NOTES.md in particular contains credentials.
              "LOCAL-DB-NOTES.md",
              "update-plugins.sh",
          }

          excluded_patterns = (
              ".env.*",
              "*.sql",
              "*.bak",
              "*.zip",
              "*.log",
              "docker-compose*.yml",
              "docker-compose*.yaml",
          )

          def excluded(path):
              path = path.replace("\\", "/")

              if path in excluded_exact:
                  return True

              # Root-level PNGs are screenshot artifacts — real site
              # images always live under wp-content/.
              if "/" not in path and path.endswith(".png"):
                  return True

              if path.startswith(excluded_prefixes):
                  return True

              name = Path(path).name

              return any(
                  fnmatch.fnmatch(path, pattern) or
                  fnmatch.fnmatch(name, pattern)
                  for pattern in excluded_patterns
              )

          result = subprocess.run(
              ["git", "diff", "--name-status", "-M", "-z", base, "HEAD"],
              check=True,
              stdout=subprocess.PIPE,
          )

          parts = [
              p for p in
              result.stdout.decode("utf-8", errors="surrogateescape").split("\0")
              if p
          ]

          uploads = []
          deletes = []

          i = 0
          while i < len(parts):
              status = parts[i]
              i += 1

              if status.startswith(("R", "C")):
                  old = parts[i]
                  new = parts[i + 1]
                  i += 2

                  if not excluded(old):
                      deletes.append(old)
                  if not excluded(new):
                      uploads.append(new)
              else:
                  path = parts[i]
                  i += 1

                  if excluded(path):
                      continue

                  if status.startswith("D"):
                      deletes.append(path)
                  else:
                      uploads.append(path)

          # Manual-run extra deletes bypass the exclusion list on
          # purpose — they exist to remove files the exclusions
          # accidentally let through (or that predate them).
          for p in os.environ.get("DELETE_PATHS", "").split(","):
              p = p.strip().strip("/")
              if p and p not in deletes:
                  deletes.append(p)

          deploy_root = Path(".deploy")

          for filename in uploads:
              src = Path(filename)
              if not src.exists() or not src.is_file():
                  continue

              dest = deploy_root / src
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)

          with open(".deploy-deletes", "w", encoding="utf-8",
                    errors="surrogateescape") as f:
              for filename in deletes:
                  f.write(filename + "\n")

          print()
          print(f"{len(uploads)} file(s) to upload")
          print(f"{len(deletes)} file(s) to delete")

          for f in uploads:
              print("+", f)
          for f in deletes:
              print("-", f)
          PY

      # InfinityFree allows ~3 FTP connections per account and the
      # control connection uses one — keep --parallel=2, not higher.
      - name: Deploy changed files
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          REMOTE="physioelpida.gr/htdocs"

          # `open` lives inside the script: lftp parses arguments placed
          # AFTER the positional URL as options to `open` (a trailing
          # `-f script` became `open -f` and failed instantly).
          # Heredoc lines sit at the block's base indent so they land
          # flush-left in the file.
          cat > .lftp-script <<EOF
          open -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER"
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set ftp:passive-mode yes
          mirror --reverse --parallel=2 --ignore-time --no-perms --verbose=1 .deploy ${REMOTE}
          EOF

          # Remove files deleted/renamed in Git. rm -f won't error on
          # already-missing paths. NOT mirror --delete: .deploy only
          # holds changed files, so --delete would wipe the site.
          python3 <<'PY' >> .lftp-script
          from pathlib import Path

          remote = "physioelpida.gr/htdocs"

          p = Path(".deploy-deletes")
          if p.exists():
              for path in p.read_text(encoding="utf-8",
                                      errors="surrogateescape").splitlines():
                  path = path.replace("\\", "/").replace('"', '\\"')
                  print(f'rm -f "{remote}/{path}"')
          PY

          echo "bye" >> .lftp-script

          # Show the script for debugging, hiding the credentials line.
          sed 's/^open -u.*/open -u ***/' .lftp-script

          lftp -f .lftp-script

      # NOTE: no remote W3TC cache purge here — `rm -r wp-content/cache`
      # over FTP deletes hundreds of files one-by-one and dominates the
      # deploy time. Flush the cache from WP admin (Performance →
      # purge all caches) after deploying changes that affect output.
