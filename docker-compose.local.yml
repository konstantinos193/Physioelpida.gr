services:
  wordpress:
    image: wordpress:7.1.1-php8.4-apache
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./.docker-local/wp-config.php:/var/www/html/wp-config.php
      - ./.docker-local/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - wp_includes:/var/www/html/wp-includes
      - wp_admin:/var/www/html/wp-admin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_local
      MYSQL_DATABASE: physioelpida
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_pass_local
    volumes:
      - db_data:/var/lib/mysql
      - ./db_export.sql:/seed/db_export.sql:ro
      - ./.docker-local/import-db.sh:/docker-entrypoint-initdb.d/00-import.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  wp_includes:
  wp_admin:
